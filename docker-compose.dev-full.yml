services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: node:20.20-alpine
    working_dir: /app
    command: sh -c "npm install --silent && node --watch src/index.js"
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://atlas:atlas_dev@postgres:5432/atlas
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
      # BETTER_AUTH_SECRET chargé depuis server/.env (env_file ci-dessus)
      # ⚠ Ne PAS mettre de secret en dur ici — générer via: openssl rand -base64 32
      BETTER_AUTH_URL: http://localhost:3001
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20.20-alpine
    working_dir: /app
    command: sh -c "npm install --silent && npm run dev -- --host"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_CRISP_WEBSITE_ID: ${VITE_CRISP_WEBSITE_ID:-}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules

  e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    network_mode: host
    working_dir: /app
    entrypoint: sh -c "npm install --silent && exec \"$$@\"" --
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    profiles:
      - e2e

volumes:
  postgres_dev_data:
  e2e_node_modules:
