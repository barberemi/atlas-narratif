<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Spectral','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif">
  <defs>
    <radialGradient id="glowGreen" cx="90%" cy="-8%" r="70%">
      <stop offset="0" stop-color="#5cae8e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5cae8e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="96%" cy="108%" r="65%">
      <stop offset="0" stop-color="#cba15e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#cba15e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.08" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cae8e"/>
      <stop offset="0.42" stop-color="#5cae8e"/>
      <stop offset="0.58" stop-color="#cba15e"/>
      <stop offset="1" stop-color="#cba15e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#15171b"/>
  <rect width="1200" height="630" fill="url(#glowGreen)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>

  <!-- courbes de niveau (motif atlas) -->
  <g mask="url(#fadeMask)" stroke="#cba15e" stroke-opacity="0.10" fill="none">
    <circle cx="1032" cy="189" r="53"/>
    <circle cx="1032" cy="189" r="106"/>
    <circle cx="1032" cy="189" r="159"/>
    <circle cx="1032" cy="189" r="212"/>
    <circle cx="1032" cy="189" r="265"/>
    <circle cx="1032" cy="189" r="318"/>
    <circle cx="1032" cy="189" r="371"/>
  </g>

  <!-- rose des vents laiton -->
  <g transform="translate(844,89) scale(4.52)" opacity="0.5">
    <circle cx="50" cy="50" r="47" stroke="#cba15e" stroke-width="0.5" opacity="0.65" fill="none"/>
    <circle cx="50" cy="50" r="36" stroke="#cba15e" stroke-width="0.4" opacity="0.5" fill="none"/>
    <circle cx="50" cy="50" r="24" stroke="#5cae8e" stroke-width="0.4" opacity="0.4" fill="none"/>
    <path d="M50 5 L57.5 50 L50 95 L42.5 50 Z" fill="#cba15e" opacity="0.34"/>
    <path d="M5 50 L50 42.5 L95 50 L50 57.5 Z" fill="#cba15e" opacity="0.16"/>
    <path d="M22 22 L52 48 L78 78 L48 52 Z" fill="#5cae8e" opacity="0.18"/>
    <circle cx="50" cy="50" r="2.6" fill="#cba15e"/>
  </g>

  <!-- marque -->
  <g>
    <circle cx="99" cy="88" r="15" fill="none" stroke="#cba15e" stroke-width="2"/>
    <circle cx="99" cy="88" r="6.5" fill="#cba15e"/>
    <text x="128" y="97" font-size="27" font-weight="600" letter-spacing="0.4" fill="#ece7db">Atlas Narratif</text>
  </g>

  <!-- accroche -->
  <text x="84" y="252" font-size="31" font-style="italic" font-weight="500" fill="#cba15e">L'atlas de ton roman.</text>

  <!-- H1 -->
  <text x="80" y="340" font-size="76" font-weight="600" letter-spacing="-1.2" fill="#ece7db">Structure ton roman.</text>
  <text x="80" y="424" font-size="76" font-weight="600" letter-spacing="-1.2" fill="#5cae8e">Garde ta plume.</text>

  <!-- sous-ligne -->
  <text x="84" y="500" font-size="25" fill="#a9a291">Save the Cat &#183; Voyage du Héros. Visualise ta saga en entier,</text>
  <text x="84" y="533" font-size="25" fill="#a9a291">repère les incohérences.</text>

  <!-- pied -->
  <text x="84" y="588" font-size="22" letter-spacing="0.6" fill="#a9a291" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
    <tspan fill="#ece7db">atlas-narratif.com</tspan><tspan fill="#5cae8e">&#160;&#160;·&#160;&#160;</tspan>gratuit<tspan fill="#5cae8e">&#160;&#160;·&#160;&#160;</tspan>sans clé API</text>
</svg>
