services:

  # ── Reverse proxy + TLS (Let's Encrypt) ────────────────────────────────────
  traefik:
    image: traefik:v3.3
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirection HTTP → HTTPS automatique
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt (HTTP challenge)
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Timeouts — fail fast pendant les rolling updates
      - --serversTransport.forwardingTimeouts.dialTimeout=2s
      - --serversTransport.forwardingTimeouts.responseHeaderTimeout=5s
      # Dashboard (exposé via labels, pas sur :8080)
      - --api.dashboard=true
      - --api.insecure=false
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
      restart_policy:
        condition: any

  # ── Frontend React (nginx) + proxy /api/ /auth/ → api ──────────────────────
  frontend:
    image: atlas-narratif-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
        VITE_CRISP_WEBSITE_ID: ${VITE_CRISP_WEBSITE_ID:-}
    environment:
      DOMAIN: ${DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 2
      labels:
        - traefik.enable=true
        - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.frontend.entrypoints=websecure
        - traefik.http.routers.frontend.tls.certresolver=letsencrypt
        - traefik.http.services.frontend.loadbalancer.server.port=80
        - traefik.http.services.frontend.loadbalancer.healthCheck.path=/
        - traefik.http.services.frontend.loadbalancer.healthCheck.interval=5s
        - traefik.http.services.frontend.loadbalancer.healthCheck.timeout=3s
      update_config:
        order: stop-first
        parallelism: 1
        delay: 5s
      rollback_config:
        order: stop-first
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
      restart_policy:
        condition: any

  # ── API Hono ────────────────────────────────────────────────────────────────
  api:
    image: atlas-narratif-api:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD}@postgres:5432/atlas
      PORT: 3001
      FRONTEND_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      ATLAS_ENCRYPTION_KEY: ${ATLAS_ENCRYPTION_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      update_config:
        order: stop-first
        parallelism: 1
        delay: 5s
      rollback_config:
        order: stop-first
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
      restart_policy:
        condition: any

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      update_config:
        order: stop-first
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
      restart_policy:
        condition: any

volumes:
  postgres_data:
    external: true
    name: atlas-narratif_postgres_data
  letsencrypt:
    external: true
    name: atlas-narratif_letsencrypt
