services:

  # ── Reverse proxy + TLS (Let's Encrypt) ────────────────────────────────────
  traefik:
    image: traefik:v3.3
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirection HTTP → HTTPS automatique
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt (HTTP challenge)
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Timeouts. dialTimeout=2s = le vrai fail-fast des rolling updates (backend
      # injoignable → 502 immédiat). responseHeaderTimeout doit en revanche couvrir
      # la requête la plus lente exposée : POST /api/…/ask (chat RAG niveau 2) fait
      # un appel LLM synchrone (LLM_TIMEOUT_MS=60s + embeddings 30s côté serveur).
      # À 5s, toute vraie recherche approfondie renvoyait un 504 Gateway Timeout.
      # Doit rester ≥ au read_timeout /api/ de nginx (95s) — cf. nginx.prod.conf.
      - --serversTransport.forwardingTimeouts.dialTimeout=2s
      - --serversTransport.forwardingTimeouts.responseHeaderTimeout=95s
      # Dashboard (exposé via labels, pas sur :8080)
      - --api.dashboard=true
      - --api.insecure=false
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
      restart_policy:
        condition: any

  # ── Frontend React (nginx) + proxy /api/ /auth/ → api ──────────────────────
  frontend:
    image: atlas-narratif-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
        VITE_CRISP_WEBSITE_ID: ${VITE_CRISP_WEBSITE_ID:-}
    environment:
      DOMAIN: ${DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 2
      labels:
        - traefik.enable=true
        # ── Router principal (DOMAIN) ──
        - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
        - traefik.http.routers.frontend.entrypoints=websecure
        - traefik.http.routers.frontend.tls.certresolver=letsencrypt
        - traefik.http.services.frontend.loadbalancer.server.port=80
        - traefik.http.services.frontend.loadbalancer.healthCheck.path=/
        - traefik.http.services.frontend.loadbalancer.healthCheck.interval=5s
        - traefik.http.services.frontend.loadbalancer.healthCheck.timeout=3s
        # ── Redirection www → apex (301) ──
        - traefik.http.routers.frontend-www.rule=Host(`www.${DOMAIN}`)
        - traefik.http.routers.frontend-www.entrypoints=websecure
        - traefik.http.routers.frontend-www.tls.certresolver=letsencrypt
        - traefik.http.routers.frontend-www.service=frontend
        - traefik.http.routers.frontend-www.middlewares=www-redirect
        - traefik.http.middlewares.www-redirect.redirectregex.regex=^https?://www\.(.+)
        - traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}
        - traefik.http.middlewares.www-redirect.redirectregex.permanent=true
      update_config:
        order: stop-first
        parallelism: 1
        delay: 5s
      rollback_config:
        order: stop-first
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
      restart_policy:
        condition: any

  # ── API Hono ────────────────────────────────────────────────────────────────
  api:
    image: atlas-narratif-api:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD}@postgres:5432/atlas
      PORT: 3001
      FRONTEND_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      ATLAS_ENCRYPTION_KEY: ${ATLAS_ENCRYPTION_KEY:-}
      # ── Chat niveau 2 (LLM) — mock par défaut si LLM_API_KEY absent ──
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_RATE_LIMIT_PER_MIN: ${LLM_RATE_LIMIT_PER_MIN:-}
      # ── Retrieval sémantique (embeddings) — 'none' = lexical (défaut) ──
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-none}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
      EMBEDDINGS_TIMEOUT_MS: ${EMBEDDINGS_TIMEOUT_MS:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      # ⚠ Avec 2 réplicas, les états EN MÉMOIRE du chat sont PAR PROCESS (pas
      # partagés) : rate-limit (→ ~2× la limite/min effective), cache de réponses
      # et cache d'embeddings (dédoublés). Acceptable à petite échelle. Pour un
      # comportement strict, passer à replicas: 1 OU externaliser vers Redis
      # (cf. TODO(multi-instance) dans server/src/routes/ask.js).
      replicas: 2
      update_config:
        order: stop-first
        parallelism: 1
        delay: 5s
      rollback_config:
        order: stop-first
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
      restart_policy:
        condition: any

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      update_config:
        order: stop-first
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
      restart_policy:
        condition: any

  # ── Ollama (embeddings — retrieval sémantique du chat) ──────────────────────
  # Interne uniquement (jamais exposé via Traefik/ports). L'API l'utilise si
  # EMBEDDINGS_PROVIDER=ollama dans .env.prod ; sinon le service reste idle
  # (~150 Mo : le modèle n'est chargé en RAM qu'à la 1re requête, puis déchargé
  # après OLLAMA_KEEP_ALIVE). Pull du modèle une fois : `make prod-ollama-pull`.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
      restart_policy:
        condition: any

volumes:
  postgres_data:
    external: true
    name: atlas-narratif_postgres_data
  letsencrypt:
    external: true
    name: atlas-narratif_letsencrypt
  # Cache des modèles Ollama — géré par Swarm, persiste au stack rm (non supprimé).
  ollama_models:
