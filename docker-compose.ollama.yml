# Override OPTIONNEL — active le retrieval sémantique du chat (niveau 2) via
# des embeddings Ollama en local (CPU, aucun tiers, aligné privacy).
#
# Le stack de base reste inchangé sans ce fichier (embeddings désactivés →
# retrieval lexical). Pour activer :
#
#   docker compose -f docker-compose.dev-full.yml -f docker-compose.ollama.yml up -d
#   # puis, une fois (télécharge le modèle ~470 Mo dans le volume ollama_models) :
#   docker compose -f docker-compose.dev-full.yml -f docker-compose.ollama.yml \
#     exec ollama ollama pull paraphrase-multilingual
# (modèle multilingue, adapté au FR. Pour de l'anglais pur : nomic-embed-text.)
#
# L'API rejoint Ollama par le nom de service `ollama` sur le réseau compose.
# Repli lexical automatique si Ollama est indisponible ou le modèle absent.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  api:
    environment:
      EMBEDDINGS_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: paraphrase-multilingual
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama_models:
