server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Headers requis pour SharedArrayBuffer (PGlite / OPFS)
  add_header Cross-Origin-Opener-Policy   "same-origin"    always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  # Assets Vite : noms hashés → cache longue durée (1 an)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Cross-Origin-Opener-Policy   "same-origin"    always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
  }

  # SPA : toutes les routes React redirigées vers index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
