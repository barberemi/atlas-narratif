name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/atlas-narratif

            echo "── Backup base de données ──"
            mkdir -p backups
            docker exec $(docker ps -q -f name=atlas_postgres) \
              pg_dump --clean --if-exists -U atlas atlas \
              | gzip > backups/atlas_$(date +%Y%m%d_%H%M%S)_pre-deploy.sql.gz

            echo "── Pull du code ──"
            git pull origin main

            echo "── Build des images (services toujours en ligne) ──"
            docker compose -f docker-compose.prod.yml --env-file .env.prod build

            TAG=$(date +%s)
            docker tag atlas-narratif-api:latest atlas-narratif-api:$TAG
            docker tag atlas-narratif-frontend:latest atlas-narratif-frontend:$TAG

            echo "── Rolling update API ──"
            docker service update --image atlas-narratif-api:$TAG --detach=false atlas_api

            echo "── Rolling update Frontend ──"
            docker service update --image atlas-narratif-frontend:$TAG --detach=false atlas_frontend

            echo "── Nettoyage images orphelines ──"
            docker image prune -f

            echo "✓ Déploiement terminé"
