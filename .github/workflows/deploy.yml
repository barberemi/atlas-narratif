name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/atlas-narratif

            echo "── Backup base de données ──"
            mkdir -p backups
            docker exec $(docker ps -q -f name=atlas_postgres) \
              pg_dump --clean --if-exists -U atlas atlas \
              | gzip > backups/atlas_$(date +%Y%m%d_%H%M%S)_pre-deploy.sql.gz

            # Déploiement via `make prod-deploy` (source unique de vérité) :
            # git pull + build + `docker stack deploy` → applique TOUTE la config de
            # docker-compose.prod.yml (labels Traefik/basicauth, timeouts, replicas,
            # env) EN PLUS des images. Un simple `service update --image` (ancien
            # comportement) laissait la config du compose non appliquée.
            echo "── Déploiement (pull + build + stack deploy) ──"
            make prod-deploy

            echo "✓ Déploiement terminé"
