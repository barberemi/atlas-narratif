name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/atlas-narratif

            echo "── Backup base de données ──"
            mkdir -p backups
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              exec -T postgres pg_dump -U atlas atlas \
              | gzip > backups/atlas_$(date +%Y%m%d_%H%M%S)_pre-deploy.sql.gz

            echo "── Pull du code ──"
            git pull origin main

            echo "── Build et redémarrage ──"
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              up -d --build --remove-orphans

            echo "── Health check ──"
            sleep 5
            curl -sf https://${{ secrets.DOMAIN }}/api/health \
              || (echo "Health check échoué — rollback..." && \
                  docker compose -f docker-compose.prod.yml --env-file .env.prod \
                    restart api && exit 1)

            echo "── Nettoyage images orphelines ──"
            docker image prune -f

            echo "✓ Déploiement terminé"
