name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Audit (frontend)
        # --omit=optional : better-auth déclare vitest en peerDependency optionnelle,
        # ce qui tire toute la toolchain de dev (vite, esbuild, postcss, nanoid) dans
        # l'arbre « prod » alors qu'elle n'est jamais installée en prod réelle
        # (npm ci --omit=dev ne l'installe pas). On l'exclut pour n'auditer que le
        # vrai runtime de production.
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Audit (server)
        run: cd server && npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Tests (frontend)
        run: npm run test:run

      - name: Tests (server)
        run: cd server && node --test src/*.test.js src/**/*.test.js
        env:
          DATABASE_URL: postgresql://localhost:5432/fake
          BETTER_AUTH_SECRET: ci-test-secret-not-real-min-32-characters
          BETTER_AUTH_URL: http://localhost:3001
          FRONTEND_URL: http://localhost:5173

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ""

  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Create server .env
        run: cp server/.env.example server/.env

      - name: Start stack (postgres + api + frontend)
        run: |
          docker compose -f docker-compose.dev-full.yml up -d postgres api frontend
          docker compose -f docker-compose.dev-full.yml exec -T postgres sh -c \
            'until pg_isready -U atlas; do sleep 1; done'

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null && break
            sleep 2
          done

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health > /dev/null && break
            sleep 2
          done

      - name: Run E2E tests
        run: |
          docker compose -f docker-compose.dev-full.yml run --rm \
            -e BASE_URL=http://localhost:5173 \
            e2e npx playwright test --reporter=list

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.dev-full.yml down -v
