# ── Rate limiting zones ───────────────────────────────────────────────────────
# Auth : 10 req/min par IP (login, register, reset password)
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# API : 60 req/min par IP
limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ── Headers de sécurité ───────────────────────────────────────────────────
  add_header X-Frame-Options        "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
  add_header X-XSS-Protection       "0" always;
  # HSTS
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # CSP — ajuster si besoin (fonts externes, CDN tiles carte, etc.)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Masquer la version nginx
  server_tokens off;

  # ── Limites globales ──────────────────────────────────────────────────────
  client_max_body_size 10m;

  # ── Resolver Docker (requis pour Swarm — résolution DNS à la volée) ──────
  resolver 127.0.0.11 valid=5s;
  set $backend http://api:3001;

  # ── Proxy API ─────────────────────────────────────────────────────────────
  location /api/ {
    limit_req zone=api burst=20 nodelay;

    proxy_pass         $backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 2s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
  }

  # ── Proxy Auth ────────────────────────────────────────────────────────────
  location /auth/ {
    limit_req zone=auth burst=5 nodelay;

    proxy_pass         $backend;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    proxy_connect_timeout 2s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;
  }

  # ── Assets Vite : noms hashés → cache longue durée (1 an) ────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ── SEO ───────────────────────────────────────────────────────────────────
  location = /robots.txt {
    expires 1d;
  }

  location = /sitemap.xml {
    expires 1d;
    add_header Content-Type application/xml;
  }

  # ── Compression gzip ─────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 256;
  gzip_vary on;

  # ── SPA : toutes les routes React → index.html ───────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
